services:
  vtn:
    build:
      context: .
      target: server
    # Published to the host (not just `expose`) so an external reverse proxy — e.g. a Caddy
    # instance running elsewhere on the LAN — can reach it at <this-host>:${VTN_PORT}. See
    # README "Run with Docker" for the Caddyfile block that fronts it with a real domain +
    # HTTPS. Copy .env.example to .env to override VTN_PORT/VTN_MQTT_ENABLED.
    ports:
      - "${VTN_PORT:-8080}:8080"
    environment:
      Vtn__MqttEnabled: "${VTN_MQTT_ENABLED:-false}"
    volumes:
      - vtn-data:/var/lib/openadr-vtn
    restart: unless-stopped

  # Plays the VEN role against `vtn` so the dashboard has something to show. Opt-in:
  # `docker compose --profile demo up`.
  fakeven:
    build:
      context: .
      target: fakeven
    command: ["http://vtn:8080", "vtn", "--fast"]
    depends_on:
      - vtn
    profiles:
      - demo

volumes:
  vtn-data:
